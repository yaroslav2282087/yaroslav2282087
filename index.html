<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Open Graph & Meta -->
  <title>twinkfrix@linux:~</title>
  <meta name="title" content="twinkfrix@linux:~">
  <meta name="description" content="Персональный интерактивный терминал twinkfrix (yaroslav2282087). Обо мне, стек технологий, проекты и контакты.">
  <meta name="author" content="twinkfrix">
  <meta name="theme-color" content="#0d1117">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yaroslav2282087.github.io/">
  <meta property="og:title" content="twinkfrix@linux:~">
  <meta property="og:description" content="Персональный интерактивный терминал twinkfrix (yaroslav2282087). Обо мне, стек технологий, проекты и контакты.">
  
  <meta property="twitter:card" content="summary_large_image">

  <meta property="twitter:description" content="Персональный интерактивный терминал twinkfrix (yaroslav2282087).">

  <style>
    :root {
      --bg-color: #0b0e14;
      --window-bg: #151921;
      --header-bg: #1f2430;
      --border-color: #2b3245;
      --text-main: #d3dae3;
      --prompt-user: #4ade80;
      --prompt-host: #38bdf8;
      --prompt-path: #facc15;
      --accent-blue: #60a5fa;
      --accent-purple: #c084fc;
      --accent-red: #f87171;
      --accent-dim: #64748b;
      --font-stack: "JetBrains Mono", "Fira Code", Consolas, Monaco, "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый эффект сетки */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* Окно терминала */
    .terminal-window {
      width: 100%;
      max-width: 950px;
      height: 85vh;
      max-height: 820px;
      min-height: 480px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Верхняя плашка окна */
    .terminal-header {
      background: var(--header-bg);
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-close { background: #ff5f56; }
    .dot-minimize { background: #ffbd2e; }
    .dot-maximize { background: #27c93f; }

    .window-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--accent-dim);
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-right: 48px; /* компенсация для точного центра */
    }

    /* Тело консоли */
    .terminal-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
      cursor: text;
    }

    .terminal-body::-webkit-scrollbar {
      width: 8px;
    }

    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Блоки вывода */
    .history-entry {
      margin-bottom: 10px;
    }

    .output {
      margin: 4px 0 12px 0;
      white-space: pre-wrap;
    }

    /* Промпт */
    .prompt-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .prompt-prefix {
      display: inline-flex;
      align-items: center;
      user-select: none;
      white-space: nowrap;
    }

    .user { color: var(--prompt-user); font-weight: bold; }
    .at { color: var(--accent-dim); }
    .host { color: var(--prompt-host); font-weight: bold; }
    .colon { color: var(--accent-dim); }
    .path { color: var(--prompt-path); }
    .char { color: var(--text-main); font-weight: bold; margin-left: 2px; }

    /* Поле ввода */
    .input-wrapper {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 140px;
      position: relative;
    }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      caret-color: var(--prompt-user);
      padding: 0;
      margin: 0;
    }

    /* Стилизация вывода информации */
    .c-green { color: var(--prompt-user); }
    .c-blue { color: var(--accent-blue); }
    .c-cyan { color: var(--prompt-host); }
    .c-yellow { color: var(--prompt-path); }
    .c-purple { color: var(--accent-purple); }
    .c-red { color: var(--accent-red); }
    .c-dim { color: var(--accent-dim); }
    .b { font-weight: bold; }

    .help-table {
      display: grid;
      grid-template-columns: 140px 1fr;
      row-gap: 6px;
      margin: 8px 0;
    }

    .term-link {
      color: var(--accent-blue);
      text-decoration: none;
      transition: all 0.2s;
      border-bottom: 1px dashed var(--accent-blue);
      padding-bottom: 1px;
    }

    .term-link:hover {
      color: #93c5fd;
      border-bottom-style: solid;
      text-shadow: 0 0 8px rgba(96, 165, 250, 0.4);
    }

    .ascii-art {
      font-size: 11px;
      line-height: 1.15;
      color: var(--prompt-host);
      overflow-x: auto;
      margin: 10px 0;
    }

    .separator {
      border-top: 1px dashed var(--border-color);
      margin: 10px 0;
    }

    /* Холст эффекта Matrix */
    #matrix-canvas {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      height: calc(100% - 40px);
      z-index: 10;
      background: rgba(11, 14, 20, 0.95);
      display: none;
    }

    .matrix-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--prompt-user);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--prompt-user);
      display: none;
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Адаптивность для мобильных */
    @media (max-width: 640px) {
      body {
        padding: 0;
      }
      .terminal-window {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: none;
      }
      .terminal-body {
        font-size: 13px;
        padding: 12px;
      }
      .help-table {
        grid-template-columns: 100px 1fr;
      }
      .ascii-art {
        font-size: 7.5px;
      }
      .window-title {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

  <div class="terminal-window" id="window">
    <div class="terminal-header">
      <div class="window-controls">
        <span class="dot dot-close"></span>
        <span class="dot dot-minimize"></span>
        <span class="dot dot-maximize"></span>
      </div>
      <div class="window-title">twinkfrix@linux:~</div>
    </div>

    <!-- Холст для пасхалки Matrix -->
    <canvas id="matrix-canvas"></canvas>
    <div class="matrix-hint" id="matrix-hint">Нажмите [ESC], [Q] или коснитесь экрана для выхода</div>

    <div class="terminal-body" id="term-body">
      <!-- Сюда динамически добавляются результаты команд -->
      <div id="history"></div>

      <!-- Строка инициализации при загрузке -->
      <div id="boot-line" class="output"></div>

      <!-- Активная строка ввода -->
      <div class="prompt-line" id="active-line" style="display: none;">
        <span class="prompt-prefix">
          <span class="user">twinkfrix</span><span class="at">@</span><span class="host">arch</span><span class="colon">:</span><span class="path">~</span><span class="char">$</span>
        </span>
        <div class="input-wrapper">
          <input type="text" id="cli-input" class="cmd-input" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const bootLine = document.getElementById('boot-line');
      const activeLine = document.getElementById('active-line');
      const cliInput = document.getElementById('cli-input');
      const history = document.getElementById('history');
      const termBody = document.getElementById('term-body');
      const terminalWindow = document.getElementById('window');
      const canvas = document.getElementById('matrix-canvas');
      const matrixHint = document.getElementById('matrix-hint');
      const ctx = canvas.getContext('2d');

      const bootMessage = "Инициализация протокола... Готово. Введите help для списка команд.";
      let charIndex = 0;
      let isBooting = true;
      let matrixInterval = null;

      // История команд (навигация стрелками)
      const commandHistory = [];
      let historyPos = -1;

      // Экранирование вывода
      function escapeHTML(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Фокусировка при клике в любое место окна (кроме кликов по ссылкам)
      terminalWindow.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && !matrixInterval) {
          cliInput.focus();
        }
      });

      // Скролл вниз
      function scrollToBottom() {
        termBody.scrollTop = termBody.scrollHeight;
      }

      // 1. Boot sequence: эффект печатания
      function typeBootSequence() {
        if (charIndex < bootMessage.length) {
          bootLine.textContent += bootMessage.charAt(charIndex);
          charIndex++;
          setTimeout(typeBootSequence, 28);
          scrollToBottom();
        } else {
          isBooting = false;
          activeLine.style.display = 'flex';
          cliInput.focus();
          scrollToBottom();
        }
      }

      setTimeout(typeBootSequence, 350);

      // ASCII-логотип
      const bannerText = `
  __             _         _      __         _        
 / /_ _      __ (_) ____  | | __ / /_  _____ (_) _  __
/ __/| | /| / // // __ \\ | |/ // __/ / ___// // |/_/
/ /_  | |/ |/ // // / / / |   </ / /_  / /   / / _>  <  
\\__/  |__/|__//_//_/ /_/  |_|\\_\\\\__/ /_/   /_/ /_/|_|  
                                                      
   [ Arch Linux / Kernel: 6.8.9-arch1-1 / Shell: zsh ]
`;

      // 2. Обработка команд
      const commands = {
        help: () => {
          return `
<span class="b c-cyan">ДОСТУПНЫЕ КОМАНДЫ:</span>
<div class="separator"></div>
<div class="help-table">
  <div><span class="c-green b">about</span></div>    <div>Информация обо мне, стек и интересы</div>
  <div><span class="c-green b">socials</span></div>  <div>Ссылки на соцсети и контакты</div>
  <div><span class="c-green b">banner</span></div>   <div>Вывести логотип twinkfrix</div>
  <div><span class="c-green b">matrix</span></div>   <div>Интерактивный эффект матрицы</div>
  <div><span class="c-green b">clear</span></div>    <div>Очистить терминал</div>
  <div><span class="c-green b">help</span></div>     <div>Показать эту справку</div>
</div>
<div class="separator"></div>
<span class="c-dim">Совет: нажимайте [Вверх]/[Вниз] для навигации по истории команд.</span>`;
        },

        about: () => {
          return `
<span class="b c-cyan">══ [ USER PROFILE: twinkfrix ] ══</span>

<span class="b c-yellow">Никнейм:</span>      twinkfrix (Ярослав)
<span class="b c-yellow">Локация:</span>      Киберпространство / Linux
<span class="b c-yellow">Интересы:</span>     Backend-разработка, CLI-интерфейсы, автоматизация, Open Source

<span class="b c-yellow">Технологии & Стек:</span>
  • <span class="c-green">Языки:</span>        JavaScript, TypeScript, Python, Bash
  • <span class="c-green">Инструменты:</span>  Git, Docker, Linux (Arch/Debian), Neovim, VSCode
  • <span class="c-green">Веб:</span>          HTML5, CSS3, REST API, Node.js

<span class="b c-yellow">О себе:</span>
  Люблю чистый и читаемый код, терминальный минимализм и быстрые консольные
  утилиты. Создаю удобные скрипты и практичные пет-проекты.
`;
        },

        socials: () => {
          return `
<span class="b c-cyan">══ [ СОЦИАЛЬНЫЕ СЕТИ И КОНТАКТЫ ] ══</span>

  <span class="b c-purple">GitHub:</span>    <a class="term-link" href="https://github.com/yaroslav2282087" target="_blank" rel="noopener noreferrer">github.com/yaroslav2282087</a>
  <span class="b c-blue">Telegram:</span>  <a class="term-link" href="https://t.me/twinkfrix" target="_blank" rel="noopener noreferrer">t.me/twinkfrix</a> <span class="c-dim">(замените на свой юзернейм)</span>
  <span class="b c-cyan">Discord:</span>   <span class="c-dim">@twinkfrix</span> <span class="c-dim">(добавляйтесь по нику)</span>
  <span class="b c-red">Steam:</span>     <a class="term-link" href="https://steamcommunity.com/id/twinkfrix" target="_blank" rel="noopener noreferrer">steamcommunity.com/id/twinkfrix</a>

<span class="c-dim">Все ссылки кликабельны и открываются в новой вкладке.</span>`;
        },

        banner: () => {
          return `<pre class="ascii-art">${escapeHTML(bannerText)}</pre>`;
        },

        clear: () => {
          history.innerHTML = '';
          bootLine.textContent = '';
          return null;
        },

        matrix: () => {
          startMatrix();
          return null;
        }
      };

      // Выполнение команды
      function executeCommand(rawCommand) {
        const trimmed = rawCommand.trim();
        if (!trimmed) return;

        // Сохраняем в историю
        commandHistory.push(rawCommand);
        historyPos = commandHistory.length;

        // Создаем запись предыдущей строки в историю
        const entry = document.createElement('div');
        entry.className = 'history-entry';
        entry.innerHTML = `
          <div class="prompt-line">
            <span class="prompt-prefix">
              <span class="user">twinkfrix</span><span class="at">@</span><span class="host">arch</span><span class="colon">:</span><span class="path">~</span><span class="char">$</span>
            </span>
            <span>${escapeHTML(rawCommand)}</span>
          </div>
        `;

        const cmdKey = trimmed.toLowerCase();
        let resultHtml = '';

        if (commands.hasOwnProperty(cmdKey)) {
          resultHtml = commands[cmdKey]();
        } else {
          resultHtml = `<span class="c-red">bash: ${escapeHTML(trimmed)}: команда не найдена.</span> Введите <span class="c-green b">help</span> для списка доступных команд.`;
        }

        if (resultHtml !== null) {
          const output = document.createElement('div');
          output.className = 'output';
          output.innerHTML = resultHtml;
          entry.appendChild(output);
          history.appendChild(entry);
        }

        scrollToBottom();
      }

      // Обработка клавиш в поле ввода
      cliInput.addEventListener('keydown', (e) => {
        if (isBooting) return;

        if (e.key === 'Enter') {
          const val = cliInput.value;
          cliInput.value = '';
          executeCommand(val);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyPos > 0) {
            historyPos--;
            cliInput.value = commandHistory[historyPos] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyPos < commandHistory.length - 1) {
            historyPos++;
            cliInput.value = commandHistory[historyPos] || '';
          } else {
            historyPos = commandHistory.length;
            cliInput.value = '';
          }
        } else if (e.key === 'Tab') {
          // Автокомплит команд
          e.preventDefault();
          const current = cliInput.value.toLowerCase().trim();
          if (current) {
            const match = Object.keys(commands).find(c => c.startsWith(current));
            if (match) cliInput.value = match;
          }
        }
      });

      // 3. Пасхалка: Matrix Digital Rain
      function resizeCanvas() {
        canvas.width = terminalWindow.clientWidth;
        canvas.height = terminalWindow.clientHeight - 40;
      }

      function startMatrix() {
        resizeCanvas();
        canvas.style.display = 'block';
        matrixHint.style.display = 'block';

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const alphabet = katakana + latin;

        const fontSize = 15;
        const columns = Math.floor(canvas.width / fontSize);
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
          rainDrops[x] = 1;
        }

        function draw() {
          ctx.fillStyle = 'rgba(11, 14, 20, 0.12)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#0F0';
          ctx.font = fontSize + 'px monospace';

          for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            const x = i * fontSize;
            const y = rainDrops[i] * fontSize;

            // Голова капли ярче
            ctx.fillStyle = '#bbf7d0';
            ctx.fillText(text, x, y);

            ctx.fillStyle = '#22c55e';

            if (y > canvas.height && Math.random() > 0.975) {
              rainDrops[i] = 0;
            }
            rainDrops[i]++;
          }
        }

        matrixInterval = setInterval(draw, 33);
      }

      function stopMatrix() {
        if (matrixInterval) {
          clearInterval(matrixInterval);
          matrixInterval = null;
          canvas.style.display = 'none';
          matrixHint.style.display = 'none';
          cliInput.focus();
        }
      }

      // Выход из матрицы по кнопкам или клику
      window.addEventListener('keydown', (e) => {
        if (matrixInterval && (e.key === 'Escape' || e.key === 'q' || e.key === 'Q')) {
          stopMatrix();
        }
      });

      canvas.addEventListener('click', stopMatrix);
      window.addEventListener('resize', () => {
        if (matrixInterval) resizeCanvas();
      });

    })();
  </script>
</body>
</html>
