<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>twinkfrix@linux:~</title>
  <meta name="title" content="twinkfrix@linux:~">
  <meta name="description" content="Терминал twinkfrix (yaroslav2282087). Обо мне, контакты и стек.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yaroslav2282087.github.io/">
  <meta property="og:title" content="twinkfrix@linux:~">
  <meta property="og:description" content="Терминал twinkfrix. Обо мне, контакты и стек.">

  <style>
    :root {
      --bg-black: #000000;
      --term-bg: #0a0a0c;
      --term-header: #121216;
      --term-border: #1e1e24;
      --text: #e4e4e7;
      
      --c-user: #22c55e;
      --c-host: #38bdf8;
      --c-path: #eab308;
      --c-dim: #71717a;
      --c-cyan: #06b6d4;
      --c-purple: #c084fc;
      --c-red: #ef4444;

      --font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-black);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Компактное окно терминала */
    .terminal {
      width: 100%;
      max-width: 680px;
      height: 480px;
      background: var(--term-bg);
      border: 1px solid var(--term-border);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Верхняя панель */
    .terminal-header {
      background: var(--term-header);
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--term-border);
      user-select: none;
    }

    .controls {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      cursor: pointer;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--c-dim);
      font-weight: 500;
      margin-right: 42px;
    }

    /* Тело консоли */
    .terminal-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 13.5px;
      line-height: 1.55;
      cursor: text;
    }

    .terminal-body::-webkit-scrollbar {
      width: 5px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }

    .history-entry {
      margin-bottom: 8px;
    }

    .output {
      margin: 4px 0 10px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Промпт */
    .prompt-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .prompt {
      display: inline-flex;
      user-select: none;
      white-space: nowrap;
    }

    .u { color: var(--c-user); font-weight: 600; }
    .h { color: var(--c-host); font-weight: 600; }
    .p { color: var(--c-path); }
    .d { color: var(--c-dim); }

    .input-box {
      display: flex;
      flex: 1;
      min-width: 120px;
    }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      caret-color: var(--c-user);
      padding: 0;
      margin: 0;
    }

    /* Цвета и ссылки */
    .c-green { color: var(--c-user); }
    .c-cyan { color: var(--c-cyan); }
    .c-yellow { color: var(--c-path); }
    .c-purple { color: var(--c-purple); }
    .c-red { color: var(--c-red); }
    .c-dim { color: var(--c-dim); }
    .b { font-weight: 600; }

    .term-link {
      color: var(--c-cyan);
      text-decoration: none;
      border-bottom: 1px dashed var(--c-cyan);
    }
    .term-link:hover {
      border-bottom-style: solid;
    }

    .cmd-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      row-gap: 4px;
      margin: 6px 0;
    }

    /* Оверлей Nyan Cat */
    #nyan-canvas {
      position: absolute;
      top: 34px;
      left: 0;
      width: 100%;
      height: calc(100% - 34px);
      z-index: 10;
      display: none;
      background: #000;
    }

    .nyan-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--c-cyan);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      display: none;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .terminal {
        height: 100vh;
        border: none;
        border-radius: 0;
      }
      .title { margin-right: 0; }
    }
  </style>
</head>
<body>

  <div class="terminal" id="term-window">
    <div class="terminal-header">
      <div class="controls">
        <span class="dot dot-red" onclick="executeCommand('clear')"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="title">twinkfrix@linux:~</div>
    </div>

    <!-- Canvas для Nyan Cat -->
    <canvas id="nyan-canvas"></canvas>
    <div id="nyan-hint" class="nyan-hint">Нажмите [ESC] или коснитесь экрана для выхода</div>

    <div class="terminal-body" id="term-body">
      <div id="history"></div>
      <div id="boot-line" class="output"></div>

      <div class="prompt-line" id="active-line" style="display: none;">
        <span class="prompt">
          <span class="u">twinkfrix</span><span class="d">@</span><span class="h">arch</span><span class="d">:</span><span class="p">~</span><span class="d">$</span>&nbsp;
        </span>
        <div class="input-box">
          <input type="text" id="cli-input" class="cmd-input" autofocus autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const bootLine = document.getElementById('boot-line');
      const activeLine = document.getElementById('active-line');
      const cliInput = document.getElementById('cli-input');
      const history = document.getElementById('history');
      const termBody = document.getElementById('term-body');
      const termWindow = document.getElementById('term-window');
      const nyanCanvas = document.getElementById('nyan-canvas');
      const nyanHint = document.getElementById('nyan-hint');
      const nCtx = nyanCanvas.getContext('2d');

      const bootMsg = "Инициализация протокола... Готово. Введите help для списка команд.";
      let charIdx = 0;
      let isBooting = true;
      let nyanRunning = false;
      let nyanTimer = null;

      const cmdHistory = [];
      let historyIdx = -1;

      function escapeHTML(str) {
        return str.replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
      }

      function scrollToBottom() {
        termBody.scrollTop = termBody.scrollHeight;
      }

      // Фокус на инпут при клике в окно терминала
      termWindow.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && !nyanRunning) {
          cliInput.focus();
        }
      });

      // Печатание строки инициализации
      function typeBoot() {
        if (charIdx < bootMsg.length) {
          bootLine.textContent += bootMsg.charAt(charIdx);
          charIdx++;
          setTimeout(typeBoot, 22);
          scrollToBottom();
        } else {
          isBooting = false;
          activeLine.style.display = 'flex';
          cliInput.focus();
          scrollToBottom();
        }
      }
      setTimeout(typeBoot, 150);

      // Список команд
      const commands = {
        help: () => {
          return `<span class="c-cyan b">Команды:</span>
<div class="cmd-row">
  <div><span class="c-green b">about</span></div>    <div>обо мне и стек</div>
  <div><span class="c-green b">socials</span></div>  <div>контакты и соцсети</div>
  <div><span class="c-green b">nyan</span></div>     <div>анимированный nyan cat</div>
  <div><span class="c-green b">clear</span></div>    <div>очистить терминал</div>
  <div><span class="c-green b">help</span></div>     <div>список команд</div>
</div>`;
        },

        about: () => {
          return `<span class="c-yellow b">twinkfrix (Ярослав)</span>
─────────────────────────────────────
• <span class="c-green">Стек:</span>     TypeScript, JavaScript, Python, Bash
• <span class="c-green">ОС:</span>       Arch Linux / Neovim
• <span class="c-green">Профиль:</span>  Бэкенд, CLI-скрипты, автоматизация`;
        },

        socials: () => {
          return `<span class="c-cyan b">Контакты:</span>
─────────────────────────────────────
• <span class="c-purple b">Telegram:</span> <a class="term-link" href="https://t.me/moggudp" target="_blank" rel="noopener">t.me/moggudp</a>
• <span class="c-cyan b">GitHub:</span>   <a class="term-link" href="https://github.com/yaroslav2282087" target="_blank" rel="noopener">github.com/yaroslav2282087</a>
• <span class="c-dim b">Discord:</span>  twinkfrix
• <span class="c-red b">Steam:</span>    <a class="term-link" href="https://steamcommunity.com/id/twinkfrix" target="_blank" rel="noopener">twinkfrix</a>`;
        },

        clear: () => {
          history.innerHTML = '';
          bootLine.textContent = '';
          return null;
        },

        nyan: () => {
          startNyan();
          return null;
        }
      };

      // Выполнение введенной команды
      window.executeCommand = function (raw) {
        const val = raw.trim();
        if (!val) return;

        cmdHistory.push(raw);
        historyIdx = cmdHistory.length;

        const entry = document.createElement('div');
        entry.className = 'history-entry';
        entry.innerHTML = `
          <div class="prompt-line">
            <span class="prompt">
              <span class="u">twinkfrix</span><span class="d">@</span><span class="h">arch</span><span class="d">:</span><span class="p">~</span><span class="d">$</span>&nbsp;
            </span>
            <span>${escapeHTML(raw)}</span>
          </div>
        `;

        const cmd = val.toLowerCase();
        let result = '';

        if (commands.hasOwnProperty(cmd)) {
          result = commands[cmd]();
        } else {
          result = `<span class="c-red">bash: ${escapeHTML(val)}: команда не найдена.</span> Введите <span class="c-green b">help</span> для списка команд.`;
        }

        if (result !== null) {
          const out = document.createElement('div');
          out.className = 'output';
          out.innerHTML = result;
          entry.appendChild(out);
          history.appendChild(entry);
        }

        scrollToBottom();
      };

      // Слушатель клавиатуры
      cliInput.addEventListener('keydown', (e) => {
        if (isBooting) return;

        if (e.key === 'Enter') {
          const val = cliInput.value;
          cliInput.value = '';
          executeCommand(val);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyIdx > 0) {
            historyIdx--;
            cliInput.value = cmdHistory[historyIdx] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIdx < cmdHistory.length - 1) {
            historyIdx++;
            cliInput.value = cmdHistory[historyIdx] || '';
          } else {
            historyIdx = cmdHistory.length;
            cliInput.value = '';
          }
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const cur = cliInput.value.toLowerCase().trim();
          if (cur) {
            const m = Object.keys(commands).find(c => c.startsWith(cur));
            if (m) cliInput.value = m;
          }
        }
      });

      // ================= NYAN CAT ANIMATION =================
      function startNyan() {
        nyanRunning = true;
        nyanCanvas.width = termWindow.clientWidth;
        nyanCanvas.height = termWindow.clientHeight - 34;
        nyanCanvas.style.display = 'block';
        nyanHint.style.display = 'block';

        const stars = Array.from({ length: 45 }, () => ({
          x: Math.random() * nyanCanvas.width,
          y: Math.random() * nyanCanvas.height,
          speed: Math.random() * 4 + 2,
          size: Math.random() * 2.5 + 1
        }));

        let tick = 0;
        const rainbow = ['#ff0000', '#ff9900', '#ffff00', '#33ff00', '#0099ff', '#6633ff'];

        function draw() {
          tick++;
          const w = nyanCanvas.width;
          const h = nyanCanvas.height;

          nCtx.fillStyle = '#050713';
          nCtx.fillRect(0, 0, w, h);

          // Звезды
          nCtx.fillStyle = '#ffffff';
          for (let s of stars) {
            s.x -= s.speed;
            if (s.x < 0) { s.x = w; s.y = Math.random() * h; }
            nCtx.fillRect(s.x, s.y, s.size, s.size);
          }

          const catX = w * 0.44;
          const catY = (h / 2) + Math.sin(tick * 0.18) * 10;

          // Радуга
          const sH = 5;
          for (let x = 0; x < catX; x += 8) {
            const wave = Math.sin((x + tick * 4) / 20) * 6;
            rainbow.forEach((color, i) => {
              nCtx.fillStyle = color;
              nCtx.fillRect(x, catY - 15 + (i * sH) + wave, 10, sH);
            });
          }

          // Рисуем кота
          nCtx.save();
          nCtx.translate(catX, catY);

          // Хвост
          nCtx.fillStyle = '#999';
          nCtx.fillRect(-34, 2 + Math.sin(tick * 0.3) * 4, 10, 5);

          // Лапы
          const leg = Math.sin(tick * 0.35) * 2;
          nCtx.fillRect(-16 + leg, 16, 7, 6);
          nCtx.fillRect(10 - leg, 16, 7, 6);

          // Тост
          nCtx.fillStyle = '#ffd199';
          nCtx.fillRect(-20, -15, 40, 30);
          nCtx.fillStyle = '#ff99cc';
          nCtx.fillRect(-17, -12, 34, 24);

          // Голова
          nCtx.fillStyle = '#999';
          nCtx.fillRect(8, -10, 22, 18);

          // Уши
          nCtx.fillRect(10, -16, 5, 6);
          nCtx.fillRect(23, -16, 5, 6);

          // Глаза
          nCtx.fillStyle = '#000';
          nCtx.fillRect(14, -5, 3, 4);
          nCtx.fillRect(24, -5, 3, 4);

          // Щечки
          nCtx.fillStyle = '#ff6699';
          nCtx.fillRect(10, -1, 3, 3);
          nCtx.fillRect(27, -1, 3, 3);

          nCtx.restore();
        }

        nyanTimer = setInterval(draw, 1000 / 30);
      }

      function stopNyan() {
        if (nyanRunning) {
          clearInterval(nyanTimer);
          nyanRunning = false;
          nyanCanvas.style.display = 'none';
          nyanHint.style.display = 'none';
          cliInput.focus();
        }
      }

      window.addEventListener('keydown', (e) => {
        if (nyanRunning && (e.key === 'Escape' || e.key === 'q' || e.key === 'Q')) {
          stopNyan();
        }
      });

      nyanCanvas.addEventListener('click', stopNyan);
    })();
  </script>
</body>
</html>
