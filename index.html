  <style>
    :root {
      --bg-body: #000000;
      --bg-terminal: #07090e;
      --bg-header: #0e1118;
      --border-color: #1e2433;
      --text-main: #e2e8f0;
      
      --c-user: #10b981;
      --c-host: #38bdf8;
      --c-path: #fbbf24;
      --c-cyan: #22d3ee;
      --c-purple: #c084fc;
      --c-red: #f87171;
      --c-dim: #64748b;
      --c-white: #ffffff;
      --c-accent: #38bdf8;

      --font-mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
    }

    /* Альтернативные темы через команду theme */
    body.theme-matrix {
      --bg-terminal: #020b05;
      --border-color: #064e1e;
      --text-main: #4ade80;
      --c-user: #22c55e;
      --c-host: #16a34a;
      --c-path: #86efac;
      --c-accent: #22c55e;
    }

    body.theme-cyber {
      --bg-terminal: #0a0614;
      --border-color: #3b145a;
      --text-main: #f5d0fe;
      --c-user: #f43f5e;
      --c-host: #06b6d4;
      --c-path: #e879f9;
      --c-accent: #d946ef;
    }

    body.theme-amber {
      --bg-terminal: #0e0a02;
      --border-color: #452c08;
      --text-main: #fde68a;
      --c-user: #f59e0b;
      --c-host: #fbbf24;
      --c-path: #d97706;
      --c-accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый кибер-эффект */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 80%),
        repeating-linear-gradient(rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 3px, rgba(255, 255, 255, 0.012) 3px, rgba(255, 255, 255, 0.012) 4px);
      pointer-events: none;
      z-index: 0;
    }

    /* Окно терминала */
    .terminal-window {
      width: 100%;
      max-width: 1060px;
      height: 88vh;
      max-height: 880px;
      min-height: 520px;
      background: var(--bg-terminal);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 
        0 0 50px rgba(0, 0, 0, 0.95),
        0 0 20px rgba(56, 189, 248, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(8px);
    }

    /* Шапка окна */
    .terminal-header {
      background: var(--bg-header);
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s;
      cursor: pointer;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-close { background: #ef4444; }
    .dot-min { background: #f59e0b; }
    .dot-max { background: #10b981; }

    .window-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--c-dim);
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-right: 52px;
    }

    /* Тело консоли */
    .terminal-body {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.62;
      word-break: break-word;
      cursor: text;
    }

    .terminal-body::-webkit-scrollbar {
      width: 8px;
    }
    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 4px;
    }
    .terminal-body::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Вывод истории */
    .history-entry {
      margin-bottom: 14px;
    }

    .output {
      margin: 6px 0 14px 0;
      white-space: pre-wrap;
    }

    /* Промпт */
    .prompt-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .prompt-prefix {
      display: inline-flex;
      align-items: center;
      user-select: none;
      white-space: nowrap;
    }

    .user { color: var(--c-user); font-weight: bold; }
    .at { color: var(--c-dim); }
    .host { color: var(--c-host); font-weight: bold; }
    .colon { color: var(--c-dim); }
    .path { color: var(--c-path); }
    .char { color: var(--text-main); font-weight: bold; margin-left: 2px; }

    .input-wrapper {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 140px;
    }

    .cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      caret-color: var(--c-user);
      padding: 0;
      margin: 0;
    }

    /* Стилизация и цвета текста */
    .c-green { color: var(--c-user); }
    .c-blue { color: var(--c-host); }
    .c-cyan { color: var(--c-cyan); }
    .c-yellow { color: var(--c-path); }
    .c-purple { color: var(--c-purple); }
    .c-red { color: var(--c-red); }
    .c-dim { color: var(--c-dim); }
    .c-white { color: var(--c-white); }
    .b { font-weight: bold; }

    .term-link {
      color: var(--c-cyan);
      text-decoration: none;
      border-bottom: 1px dashed var(--c-cyan);
      transition: all 0.2s;
    }
    .term-link:hover {
      color: #bae6fd;
      border-bottom-style: solid;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .separator {
      border-top: 1px dashed var(--border-color);
      margin: 10px 0;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      font-size: 11.5px;
      border-radius: 4px;
      background: #131d2e;
      border: 1px solid #233552;
      color: var(--c-cyan);
      margin-right: 4px;
    }

    .grid-table {
      display: grid;
      grid-template-columns: 170px 1fr;
      row-gap: 6px;
      column-gap: 12px;
      margin: 8px 0;
    }

    .pagination-bar {
      margin-top: 10px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--c-host);
      font-size: 13px;
    }

    .ascii-box {
      font-family: monospace;
      font-size: 11px;
      line-height: 1.18;
      overflow-x: auto;
      margin: 6px 0;
      color: var(--c-cyan);
    }

    /* Полноэкранные холсты для Nyan Cat и Matrix */
    .fullscreen-overlay {
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      height: calc(100% - 42px);
      z-index: 20;
      display: none;
      background: #000;
    }

    .overlay-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--c-cyan);
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      display: none;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
      animation: pulse 1.8s infinite;
      text-align: center;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
    }

    /* Мобильная адаптивность */
    @media (max-width: 720px) {
      body { padding: 0; }
      .terminal-window {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: none;
      }
      .terminal-body {
        font-size: 13px;
        padding: 14px;
      }
      .grid-table {
        grid-template-columns: 120px 1fr;
        font-size: 12.5px;
      }
      .window-title { margin-right: 0; }
      .ascii-box { font-size: 7.5px; }
      .overlay-hint { font-size: 11px; padding: 6px 14px; width: 90%; }
    }
  </style>
</head>

  <script>
    (function () {
      const bootLine = document.getElementById('boot-line');
      const activeLine = document.getElementById('active-line');
      const cliInput = document.getElementById('cli-input');
      const history = document.getElementById('history');
      const termBody = document.getElementById('term-body');
      const terminalWindow = document.getElementById('window');

      const overlayHint = document.getElementById('overlay-hint');
      const mCtx = matrixCanvas.getContext('2d');

      let isBooting = true;
      let activeAnimation = null; // 'matrix' | 'nyan' | null

      const commandHistory = [];

      function escapeHTML(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      terminalWindow.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && !activeAnimation) {
          cliInput.focus();
        }
      });

      function scrollToBottom() {
        termBody.scrollTop = termBody.scrollHeight;
      }

      // Boot sequence
      function typeBootSequence() {
        if (charIndex < bootMessage.length) {
          bootLine.textContent += bootMessage.charAt(charIndex);
          charIndex++;
          setTimeout(typeBootSequence, 24);
          scrollToBottom();
        } else {
          isBooting = false;
          activeLine.style.display = 'flex';
          cliInput.focus();
          scrollToBottom();
        }
      }
      setTimeout(typeBootSequence, 200);

  <span class="badge">PostgreSQL</span> <span class="badge">Redis</span> <span class="badge">MongoDB</span> <span class="badge">Prisma</span> <span class="badge">TypeORM</span>

        theme: (args) => {

      };

      // Алиасы
      commands['neofetch'] = commands.fetch;
      commands['fastfetch'] = commands.fetch;

      // ==========================================
      // ПАРСЕР И ВЫПОЛНЕНИЕ
      // ==========================================
      window.executeCommand = function (rawCommand) {
        const trimmed = rawCommand.trim();
        if (!trimmed) return;

        commandHistory.push(rawCommand);
        historyPos = commandHistory.length;

        const entry = document.createElement('div');
        entry.className = 'history-entry';
        entry.innerHTML = `
          <div class="prompt-line">
            <span class="prompt-prefix">
              <span class="user">twinkfrix</span><span class="at">@</span><span class="host">arch</span><span class="colon">:</span><span class="path">~</span><span class="char">$</span>
            </span>
            <span>${escapeHTML(rawCommand)}</span>
          </div>
        `;

        const parts = trimmed.split(/\s+/);
        const cmdKey = parts[0].toLowerCase();
        const args = parts.slice(1);

        let resultHtml = '';

        if (commands.hasOwnProperty(cmdKey)) {
          resultHtml = commands[cmdKey](args);
        } else {
          resultHtml = `<span class="c-red">bash: ${escapeHTML(parts[0])}: команда не найдена.</span> Введите <span class="c-green b">help</span> для списка доступных команд.`;
        }

        if (resultHtml !== null) {
          const output = document.createElement('div');
          output.className = 'output';
          output.innerHTML = resultHtml;
          entry.appendChild(output);
          history.appendChild(entry);
        }

        scrollToBottom();
      };

      // Обработка клавиш в строке ввода
      cliInput.addEventListener('keydown', (e) => {
        if (isBooting) return;

        if (e.key === 'Enter') {
          const val = cliInput.value;
          cliInput.value = '';
          executeCommand(val);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyPos > 0) {
            historyPos--;
            cliInput.value = commandHistory[historyPos] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyPos < commandHistory.length - 1) {
            historyPos++;
            cliInput.value = commandHistory[historyPos] || '';
          } else {
            historyPos = commandHistory.length;
            cliInput.value = '';
          }
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const current = cliInput.value.toLowerCase().trim();
          if (current) {
            const allKeys = Object.keys(commands);
            const match = allKeys.find(c => c.startsWith(current));
            if (match) cliInput.value = match;
          }
        } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          commands.clear();
        }
      });

      // ==========================================
      // ИНТЕРАКТИВ 1: MATRIX DIGITAL RAIN
      // ==========================================
      let matrixTimer = null;
      function startMatrix() {
        activeAnimation = 'matrix';
        matrixCanvas.width = terminalWindow.clientWidth;
        matrixCanvas.height = terminalWindow.clientHeight - 42;
        matrixCanvas.style.display = 'block';
        overlayHint.style.display = 'block';

        const alphabet = '0123456789ABCDEFｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ';
        const fontSize = 16;
        const columns = Math.floor(matrixCanvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
          mCtx.fillStyle = 'rgba(0, 0, 0, 0.09)';
          mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

          mCtx.font = fontSize + 'px monospace';

          for (let i = 0; i < drops.length; i++) {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;

            mCtx.fillStyle = '#86efac';
            mCtx.fillText(text, x, y);

            mCtx.fillStyle = '#10b981';

            if (y > matrixCanvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
        }
        matrixTimer = setInterval(draw, 33);
      }

      function stopMatrix() {
        if (matrixTimer) {
          clearInterval(matrixTimer);
          matrixTimer = null;
          matrixCanvas.style.display = 'none';
        }
      }

      // ==========================================
      // ИНТЕРАКТИВ 2: ANIMATED NYAN CAT
      // ==========================================
      let nyanTimer = null;
      let nyanStartTime = 0;

      function startNyanCat() {
        activeAnimation = 'nyan';
        nyanCanvas.width = terminalWindow.clientWidth;
        nyanCanvas.height = terminalWindow.clientHeight - 42;
        nyanCanvas.style.display = 'block';
        overlayHint.style.display = 'block';
        nyanStartTime = Date.now();

        // Звезды фона
        const numStars = 65;
        const stars = [];
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: Math.random() * nyanCanvas.width,
            y: Math.random() * nyanCanvas.height,
            speed: Math.random() * 5 + 3,
            size: Math.random() * 3 + 1,
            blink: Math.random() * Math.PI
          });
        }

        let tick = 0;
        const rainbowColors = ['#ff0000', '#ff9900', '#ffff00', '#33ff00', '#0099ff', '#6633ff'];

        function drawNyan() {
          tick++;
          const w = nyanCanvas.width;
          const h = nyanCanvas.height;

          // Глубокий космос
          nCtx.fillStyle = '#050713';
          nCtx.fillRect(0, 0, w, h);

          // Отрисовка летящих звезд
          for (let s of stars) {
            s.x -= s.speed;
            s.blink += 0.08;
            if (s.x < 0) {
              s.x = w;
              s.y = Math.random() * h;
            }
            const alpha = 0.4 + 0.6 * Math.sin(s.blink);
            nCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            nCtx.fillRect(s.x, s.y, s.size, s.size);
          }

          // Позиция кота по центру с покачиванием
          const catX = w * 0.45;
          const catY = (h / 2) + Math.sin(tick * 0.15) * 14;

          // Рисуем радужный след
          const stripeHeight = 6.5;
          const waveLength = 26;
          for (let x = 0; x < catX; x += 10) {
            const waveOffset = Math.sin((x + tick * 4) / waveLength) * 8;
            rainbowColors.forEach((color, i) => {
              nCtx.fillStyle = color;
              nCtx.fillRect(x, catY - (rainbowColors.length * stripeHeight) / 2 + (i * stripeHeight) + waveOffset, 12, stripeHeight);
            });
          }

          // РИСОВАНИЕ ПИКСЕЛЬНОГО NYAN CAT
          nCtx.save();
          nCtx.translate(catX, catY);

          // Хвост
          const tailBounce = Math.sin(tick * 0.25) * 6;
          nCtx.fillStyle = '#999999';
          nCtx.fillRect(-44, 4 + tailBounce, 14, 7);

          // Лапки
          nCtx.fillStyle = '#999999';
          const legMove = Math.sin(tick * 0.3) * 3;
          nCtx.fillRect(-22 + legMove, 22, 9, 8);
          nCtx.fillRect(16 - legMove, 22, 9, 8);

          // Тело-тост (печенька Pop-Tart)
          nCtx.fillStyle = '#ffd199'; // Корочка тоста
          nCtx.fillRect(-28, -20, 56, 42);
          nCtx.fillStyle = '#ff99cc'; // Розовая глазурь
          nCtx.fillRect(-24, -16, 48, 34);

          // Посыпка на тосте
          nCtx.fillStyle = '#ff1493';
          nCtx.fillRect(-18, -10, 4, 4);
          nCtx.fillRect(-6, -4, 4, 4);
          nCtx.fillRect(10, -12, 4, 4);
          nCtx.fillRect(6, 6, 4, 4);
          nCtx.fillRect(-12, 8, 4, 4);

          // Голова кота
          nCtx.fillStyle = '#999999';
          nCtx.fillRect(12, -14, 30, 24);

          // Ушки
          nCtx.beginPath();
          nCtx.fillStyle = '#999999';
          nCtx.moveTo(14, -14);
          nCtx.lineTo(20, -26);
          nCtx.lineTo(26, -14);
          nCtx.fill();

          nCtx.beginPath();
          nCtx.moveTo(30, -14);
          nCtx.lineTo(36, -26);
          nCtx.lineTo(42, -14);
          nCtx.fill();

          // Глаза
          nCtx.fillStyle = '#000000';
          nCtx.fillRect(20, -8, 4, 5);
          nCtx.fillRect(34, -8, 4, 5);
          nCtx.fillStyle = '#ffffff';
          nCtx.fillRect(20, -8, 2, 2);
          nCtx.fillRect(34, -8, 2, 2);

          // Носик и ротик
          nCtx.fillStyle = '#000000';
          nCtx.fillRect(28, -2, 3, 2);

          // Румянец на щечках
          nCtx.fillStyle = '#ff6699';
          nCtx.fillRect(14, -2, 5, 4);
          nCtx.fillRect(38, -2, 5, 4);

          nCtx.restore();

          // Таймер полета
          const elapsed = Math.floor((Date.now() - nyanStartTime) / 1000);
          nCtx.fillStyle = '#ffffff';
          nCtx.font = 'bold 15px monospace';
          nCtx.fillText(`★ NYAN TIME: ${elapsed}s ★`, 24, 36);
        }

        nyanTimer = setInterval(drawNyan, 1000 / 30);
      }

      function stopNyanCat() {
        if (nyanTimer) {
          clearInterval(nyanTimer);
          nyanTimer = null;
          nyanCanvas.style.display = 'none';
        }
      }

      // Выход из полноэкранных анимаций
      function stopAnyAnimation() {
        if (activeAnimation === 'matrix') stopMatrix();
        if (activeAnimation === 'nyan') stopNyanCat();
        activeAnimation = null;
        overlayHint.style.display = 'none';
        cliInput.focus();
      }

      window.addEventListener('keydown', (e) => {
        if (activeAnimation && (e.key === 'Escape' || e.key === 'q' || e.key === 'Q')) {
          stopAnyAnimation();
        }
      });

      matrixCanvas.addEventListener('click', stopAnyAnimation);
      nyanCanvas.addEventListener('click', stopAnyAnimation);

      window.addEventListener('resize', () => {
        if (activeAnimation === 'matrix') {
          matrixCanvas.width = terminalWindow.clientWidth;
          matrixCanvas.height = terminalWindow.clientHeight - 42;
        } else if (activeAnimation === 'nyan') {
          nyanCanvas.width = terminalWindow.clientWidth;
          nyanCanvas.height = terminalWindow.clientHeight - 42;
        }
      });

    })();
