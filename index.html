<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>twinkfrix@terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem;
    }

    .window {
      width: 100%;
      max-width: 750px;
      background: #121212;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    /* ─── Title bar ─── */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }
    .titlebar span {
      flex: 1;
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      margin-right: 52px; /* компенсация точек для центрирования */
    }

    /* ─── Terminal body ─── */
    .terminal {
      padding: 1.2rem;
      height: 480px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .terminal::-webkit-scrollbar { width: 6px; }
    .terminal::-webkit-scrollbar-track { background: transparent; }
    .terminal::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* Цвета текста */
    .output-line { color: #ccc; white-space: pre-wrap; word-break: break-word; }
    .green { color: #28c840; }
    .cyan { color: #06b6d4; }
    .yellow { color: #ffbd2e; }
    .red { color: #ff5f57; }
    .purple { color: #a78bfa; }
    .dim { color: #555; }
    .bold { font-weight: 700; }

    /* ─── Input line ─── */
    .input-line {
      display: flex;
      align-items: center;
      color: #ccc;
    }

    .prompt {
      color: #28c840;
      font-weight: 700;
      white-space: nowrap;
      margin-right: 0.5rem;
    }
    .prompt .at { color: #555; }
    .prompt .host { color: #06b6d4; }
    .prompt .path { color: #a78bfa; }

    .input-line input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-family: inherit;
      font-size: inherit;
      caret-color: #28c840;
    }

    /* ─── Ссылки ─── */
    .terminal a {
      color: #06b6d4;
      text-decoration: none;
    }
    .terminal a:hover {
      text-decoration: underline;
    }

    /* ─── Typing animation for boot ─── */
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <span>twinkfrix@terminal: ~</span>
  </div>

  <div class="terminal" id="terminal">
    <!-- всё выводится сюда через JS -->
  </div>
</div>

<script>
const terminal = document.getElementById('terminal');

// ══════════ Команды ══════════

const commands = {

  help: () => [
    '<span class="yellow bold">╔══════════════════════════════════════╗</span>',
    '<span class="yellow bold">║         СПИСОК КОМАНД               ║</span>',
    '<span class="yellow bold">╚══════════════════════════════════════╝</span>',
    '',
    '  <span class="green bold">help</span>      <span class="dim">—</span>  помощь по командам',
    '  <span class="green bold">about</span>     <span class="dim">—</span>  пара слов обо мне',
    '  <span class="green bold">socials</span>   <span class="dim">—</span>  ссылки на соц. сети',
    '  <span class="green bold">clear</span>     <span class="dim">—</span>  очистить терминал',
    '',
  ],

  about: () => [
    '<span class="cyan bold">╔══════════════════════════════════════╗</span>',
    '<span class="cyan bold">║         ABOUT ME                     ║</span>',
    '<span class="cyan bold">╚══════════════════════════════════════╝</span>',
    '',
    '  <span class="purple bold">Ник:</span>       twinkfrix',
    '  <span class="purple bold">Занятие:</span>   делаю штуки в интернете',
    '  <span class="purple bold">Стек:</span>      всё подряд',
    '',
    '  <span class="dim">// здесь будет что-то поинтереснее, но позже</span>',
    '',
  ],

  socials: () => [
    '<span class="purple bold">╔══════════════════════════════════════╗</span>',
    '<span class="purple bold">║         SOCIALS                      ║</span>',
    '<span class="purple bold">╚══════════════════════════════════════╝</span>',
    '',
    '  <span class="green">▸</span> Telegram   <span class="dim">—</span>  <a href="https://t.me/your_username" target="_blank">t.me/your_username</a>',
    '  <span class="green">▸</span> Discord    <span class="dim">—</span>  <a href="https://discord.com/users/your_id" target="_blank">twinkfrix</a>',
    '  <span class="green">▸</span> GitHub     <span class="dim">—</span>  <a href="https://github.com/yaroslav2282087" target="_blank">github.com/yaroslav2282087</a>',
    '  <span class="green">▸</span> Steam      <span class="dim">—</span>  <a href="https://steamcommunity.com/id/your_id" target="_blank">steamcommunity.com/id/your_id</a>',
    '',
  ],

  clear: () => {
    terminal.innerHTML = '';
    createInputLine();
    return null; // не выводим ничего
  },
};

// ══════════ Утилиты ══════════

function printLines(linesArray) {
  linesArray.forEach(line => {
    const div = document.createElement('div');
    div.classList.add('output-line');
    div.innerHTML = line;
    terminal.appendChild(div);
  });
}

function printText(text, className = '') {
  const div = document.createElement('div');
  div.classList.add('output-line');
  if (className) div.classList.add(className);
  div.innerHTML = text;
  terminal.appendChild(div);
}

function createInputLine() {
  const wrapper = document.createElement('div');
  wrapper.classList.add('input-line');

  const prompt = document.createElement('span');
  prompt.classList.add('prompt');
  prompt.innerHTML = '<span class="green bold">twinkfrix</span><span class="at">@</span><span class="host">terminal</span>:<span class="path">~</span>$';

  const input = document.createElement('input');
  input.type = 'text';
  input.autofocus = true;
  input.spellcheck = false;
  input.autocomplete = 'off';

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const cmd = input.value.trim().toLowerCase();
      input.disabled = true;

      // Показать что ввёл пользователь (строка остаётся)
      if (cmd === '') {
        createInputLine();
        return;
      }

      if (commands[cmd]) {
        const result = commands[cmd]();
        if (result) {
          printLines(result);
        }
      } else {
        printText(`<span class="red">✗</span> Команда "<span class="yellow">${cmd}</span>" не найдена. Введите <span class="green">help</span> для списка команд.`);
        printText('');
      }

      if (cmd !== 'clear') {
        createInputLine();
      }
    }
  });

  wrapper.appendChild(prompt);
  wrapper.appendChild(input);
  terminal.appendChild(wrapper);

  // Авто-скролл вниз
  terminal.scrollTop = terminal.scrollHeight;
  input.focus();
}

// Клик по терминалу — фокус на текущий input
terminal.addEventListener('click', () => {
  const inputs = terminal.querySelectorAll('input:not([disabled])');
  if (inputs.length) inputs[inputs.length - 1].focus();
});

// ══════════ Boot sequence ══════════

const bootLines = [
  { text: '<span class="dim">[system]</span> Инициализация протокола...', delay: 0 },
  { text: '<span class="dim">[system]</span> Загрузка модулей <span class="green">████████████████████</span> 100%', delay: 800 },
  { text: '<span class="dim">[system]</span> <span class="green bold">Готово.</span>', delay: 1500 },
  { text: '', delay: 1800 },
  { text: 'Добро пожаловать в <span class="cyan bold">twinkfrix</span> terminal v1.0', delay: 2000 },
  { text: 'Введите <span class="green bold">help</span> для списка команд.', delay: 2200 },
  { text: '', delay: 2400 },
];

bootLines.forEach(({ text, delay }) => {
  setTimeout(() => {
    printText(text);
    terminal.scrollTop = terminal.scrollHeight;

    // После последней строки — показать инпут
    if (delay === bootLines[bootLines.length - 1].delay) {
      setTimeout(() => createInputLine(), 200);
    }
  }, delay);
});

</script>
</body>
</html>
